openapi: 3.1.0
info:
  title: GridWise API
  version: 0.1.0
paths:
  /api/v1/drivers/:
    get:
      tags:
      - drivers
      summary: Get All Drivers
      description: Get all drivers with optional filters
      operationId: get_all_drivers_api_v1_drivers__get
      parameters:
      - name: team_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Name
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(active|inactive|reserve)$
          - type: 'null'
          title: Status
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverResponse'
                title: Response Get All Drivers Api V1 Drivers  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - drivers
      summary: Create Driver
      description: Create a new driver
      operationId: create_driver_api_v1_drivers__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/drivers/{driver_id}:
    get:
      tags:
      - drivers
      summary: Get Driver
      description: Get a specific driver by ID
      operationId: get_driver_api_v1_drivers__driver_id__get
      parameters:
      - name: driver_id
        in: path
        required: true
        schema:
          type: string
          title: Driver Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - drivers
      summary: Update Driver
      description: Update an existing driver
      operationId: update_driver_api_v1_drivers__driver_id__put
      parameters:
      - name: driver_id
        in: path
        required: true
        schema:
          type: string
          title: Driver Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - drivers
      summary: Delete Driver
      description: Delete a driver (soft delete by setting status=inactive)
      operationId: delete_driver_api_v1_drivers__driver_id__delete
      parameters:
      - name: driver_id
        in: path
        required: true
        schema:
          type: string
          title: Driver Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/drivers/team/{team_name}:
    get:
      tags:
      - drivers
      summary: Get Drivers By Team
      description: Get all drivers for a specific team
      operationId: get_drivers_by_team_api_v1_drivers_team__team_name__get
      parameters:
      - name: team_name
        in: path
        required: true
        schema:
          type: string
          title: Team Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverResponse'
                title: Response Get Drivers By Team Api V1 Drivers Team  Team Name  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/constructors/:
    get:
      tags:
      - constructors
      summary: Get All Constructors
      description: Get all constructors with optional filters
      operationId: get_all_constructors_api_v1_constructors__get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(active|inactive)$
          - type: 'null'
          title: Status
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConstructorResponse'
                title: Response Get All Constructors Api V1 Constructors  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - constructors
      summary: Create Constructor
      description: Create a new constructor
      operationId: create_constructor_api_v1_constructors__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstructorCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/constructors/{constructor_id}:
    get:
      tags:
      - constructors
      summary: Get Constructor
      description: Get a specific constructor by ID
      operationId: get_constructor_api_v1_constructors__constructor_id__get
      parameters:
      - name: constructor_id
        in: path
        required: true
        schema:
          type: string
          title: Constructor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - constructors
      summary: Update Constructor
      description: Update an existing constructor
      operationId: update_constructor_api_v1_constructors__constructor_id__put
      parameters:
      - name: constructor_id
        in: path
        required: true
        schema:
          type: string
          title: Constructor Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstructorUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - constructors
      summary: Delete Constructor
      description: Delete a constructor (soft delete by setting status=inactive)
      operationId: delete_constructor_api_v1_constructors__constructor_id__delete
      parameters:
      - name: constructor_id
        in: path
        required: true
        schema:
          type: string
          title: Constructor Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rules/:
    get:
      tags:
      - rules
      summary: Get All Rules
      description: "Get all rules with optional filters.\n\nArgs:\n    is_active:\
        \ Filter by active status\n    rule_type: Filter by rule type\n\nReturns:\n\
        \    List of rules"
      operationId: get_all_rules_api_v1_rules__get
      parameters:
      - name: is_active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      - name: rule_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RuleType'
          - type: 'null'
          title: Rule Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleResponse'
                title: Response Get All Rules Api V1 Rules  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - rules
      summary: Create Rule
      description: "Create a new rule.\n\nArgs:\n    rule_data: Rule creation data\n\
        \nReturns:\n    Created rule\n\nRaises:\n    400: Invalid rule data"
      operationId: create_rule_api_v1_rules__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rules/{rule_id}:
    get:
      tags:
      - rules
      summary: Get Rule
      description: "Get a specific rule by ID.\n\nArgs:\n    rule_id: Rule ID\n\n\
        Returns:\n    Rule details\n\nRaises:\n    404: Rule not found"
      operationId: get_rule_api_v1_rules__rule_id__get
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - rules
      summary: Update Rule
      description: "Update an existing rule.\n\nArgs:\n    rule_id: Rule ID\n    rule_data:\
        \ Rule update data\n\nReturns:\n    Updated rule\n\nRaises:\n    404: Rule\
        \ not found"
      operationId: update_rule_api_v1_rules__rule_id__put
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - rules
      summary: Delete Rule
      description: "Delete a rule (soft delete by setting is_active=False).\n\nArgs:\n\
        \    rule_id: Rule ID\n\nRaises:\n    404: Rule not found"
      operationId: delete_rule_api_v1_rules__rule_id__delete
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rules/{rule_id}/toggle:
    patch:
      tags:
      - rules
      summary: Toggle Rule
      description: "Toggle rule active status.\n\nArgs:\n    rule_id: Rule ID\n\n\
        Returns:\n    Updated rule\n\nRaises:\n    404: Rule not found"
      operationId: toggle_rule_api_v1_rules__rule_id__toggle_patch
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/teams/:
    post:
      tags:
      - teams
      summary: Create Team
      description: 'Create a new fantasy team.


        Validates:

        - Exactly 5 drivers selected

        - Exactly 2 constructors selected

        - All entities are active

        - Budget cap not exceeded

        - DRS Boost assigned to one driver

        - All F1 Fantasy rules pass


        Returns the created team with validation status.'
      operationId: create_team_api_v1_teams__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - teams
      summary: Get All Teams
      description: 'Get all teams with optional filtering and pagination.


        Filters:

        - created_by: Filter by user ID

        - season: Filter by season year

        - is_valid: Filter by validation status

        - is_active: Filter by active status


        Pagination:

        - skip: Number of records to skip (default: 0)

        - limit: Maximum number of records to return (default: 20, max: 100)


        Returns paginated list of teams with summary information.'
      operationId: get_all_teams_api_v1_teams__get
      parameters:
      - name: created_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by user ID
          title: Created By
        description: Filter by user ID
      - name: season
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by season year
          title: Season
        description: Filter by season year
      - name: is_valid
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by validation status
          title: Is Valid
        description: Filter by validation status
      - name: is_active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by active status
          title: Is Active
        description: Filter by active status
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Pagination offset
          default: 0
          title: Skip
        description: Pagination offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size (max 100)
          default: 20
          title: Limit
        description: Page size (max 100)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeamsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/teams/{team_id}:
    get:
      tags:
      - teams
      summary: Get Team
      description: "Get detailed information about a specific team.\n\nArgs:\n   \
        \ team_id: Team ID\n\nReturns:\n    Full team details including drivers, constructors,\
        \ and validation status\n\nRaises:\n    404: Team not found"
      operationId: get_team_api_v1_teams__team_id__get
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          title: Team Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - teams
      summary: Update Team
      description: "Update an existing fantasy team with transfer tracking.\n\nTracks\
        \ driver/constructor changes and calculates penalties:\n- Free transfers per\
        \ race: 2\n- Penalty: -10 points per excess transfer\n- DRS Boost changes\
        \ are free (don't count as transfers)\n\nValidates:\n- Exactly 5 drivers selected\n\
        - Exactly 2 constructors selected\n- All entities are active\n- Budget cap\
        \ not exceeded\n- DRS Boost assigned to one driver\n- All F1 Fantasy rules\
        \ pass\n\nReturns the updated team with transfer history.\n\nRaises:\n   \
        \ 404: Team not found\n    422: Validation failed (with detailed violation\
        \ info)"
      operationId: update_team_api_v1_teams__team_id__put
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          title: Team Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health Check
      description: Health check endpoint
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      summary: Root
      description: Root endpoint
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ConstructorCreate:
      properties:
        name:
          type: string
          title: Name
        full_name:
          type: string
          title: Full Name
        nationality:
          type: string
          title: Nationality
        price:
          type: number
          title: Price
        status:
          type: string
          title: Status
          default: active
      type: object
      required:
      - name
      - full_name
      - nationality
      - price
      title: ConstructorCreate
    ConstructorResponse:
      properties:
        name:
          type: string
          title: Name
        full_name:
          type: string
          title: Full Name
        nationality:
          type: string
          title: Nationality
        price:
          type: number
          title: Price
        status:
          type: string
          title: Status
          default: active
        constructor_id:
          type: string
          title: Constructor Id
        price_history:
          items:
            $ref: '#/components/schemas/PriceHistory'
          type: array
          title: Price History
          default: []
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - name
      - full_name
      - nationality
      - price
      - constructor_id
      - created_at
      - updated_at
      title: ConstructorResponse
    ConstructorSelection:
      properties:
        constructor_id:
          type: string
          title: Constructor Id
        constructor_name:
          type: string
          title: Constructor Name
        price:
          type: number
          title: Price
      type: object
      required:
      - constructor_id
      - constructor_name
      - price
      title: ConstructorSelection
      description: Constructor selection in a fantasy team
    ConstructorUpdate:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
        nationality:
          anyOf:
          - type: string
          - type: 'null'
          title: Nationality
        price:
          anyOf:
          - type: number
          - type: 'null'
          title: Price
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      type: object
      title: ConstructorUpdate
    DriverCreate:
      properties:
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        team_name:
          type: string
          title: Team Name
        nationality:
          type: string
          title: Nationality
        driver_number:
          type: integer
          title: Driver Number
        price:
          type: number
          title: Price
        status:
          type: string
          title: Status
          default: active
      type: object
      required:
      - first_name
      - last_name
      - team_name
      - nationality
      - driver_number
      - price
      title: DriverCreate
    DriverResponse:
      properties:
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        team_name:
          type: string
          title: Team Name
        nationality:
          type: string
          title: Nationality
        driver_number:
          type: integer
          title: Driver Number
        price:
          type: number
          title: Price
        status:
          type: string
          title: Status
          default: active
        driver_id:
          type: string
          title: Driver Id
        price_history:
          items:
            $ref: '#/components/schemas/PriceHistory'
          type: array
          title: Price History
          default: []
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - first_name
      - last_name
      - team_name
      - nationality
      - driver_number
      - price
      - driver_id
      - created_at
      - updated_at
      title: DriverResponse
    DriverSelection:
      properties:
        driver_id:
          type: string
          title: Driver Id
        driver_name:
          type: string
          title: Driver Name
        team_name:
          type: string
          title: Team Name
        price:
          type: number
          title: Price
      type: object
      required:
      - driver_id
      - driver_name
      - team_name
      - price
      title: DriverSelection
      description: Driver selection in a fantasy team
    DriverUpdate:
      properties:
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
        team_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Name
        nationality:
          anyOf:
          - type: string
          - type: 'null'
          title: Nationality
        driver_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Driver Number
        price:
          anyOf:
          - type: number
          - type: 'null'
          title: Price
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      type: object
      title: DriverUpdate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PaginatedTeamsResponse:
      properties:
        total:
          type: integer
          title: Total
        skip:
          type: integer
          title: Skip
        limit:
          type: integer
          title: Limit
        teams:
          items:
            $ref: '#/components/schemas/TeamSummary'
          type: array
          title: Teams
      type: object
      required:
      - total
      - skip
      - limit
      - teams
      title: PaginatedTeamsResponse
      description: Paginated teams list response
    PriceHistory:
      properties:
        price:
          type: number
          title: Price
        changed_at:
          type: string
          format: date-time
          title: Changed At
        changed_by:
